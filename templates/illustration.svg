<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <!-- Starter for a new guide illustration. Copy to img/gear/NAME.svg and replace the object.
       Rules (docs/DESIGN.md, "Creating a new illustration"): keep this canvas, background and grid;
       use only the palette below; animate with transform/opacity only, 1 or 2 subtle motions;
       keep the reduced-motion rule. Never put a less-than sign inside the CSS comments. -->
  <title>Descrição curta do objeto, nas cores néon da PulsarFM</title>
  <style>
    /* Transform/opacity only, so it stays on the compositor. Runs inside an img tag. */
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .led { animation: led 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .eq path { transform-box: fill-box; transform-origin: center; animation: eq 1.1s ease-in-out infinite; }
    .eq path:nth-child(2) { animation-delay: -.35s; animation-duration: .9s; }
    .eq path:nth-child(3) { animation-delay: -.7s; animation-duration: 1.3s; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    @keyframes led { 50% { opacity: .35; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes eq { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- Palette: background #061D22 · panels #08292F / #0C3C43 / #041015 · cyan #00FFCC · blue #00CCFF
       pink #FF2D9B · purple #C044FF · pale #9AD9D3 (lines, low opacity) · white #ECFFFB -->
  <rect width="480" height="360" rx="20" fill="#061D22"/>
  <path d="M0 300H480M44 0V360M436 0V360" stroke="#9AD9D3" stroke-opacity=".09"/>

  <!-- Main object: one dark panel with a cyan or blue outline, centred, inside x 64..416 / y 40..300 -->
  <rect x="140" y="90" width="200" height="140" rx="16" fill="#08292F" stroke="#00FFCC" stroke-width="2"/>
  <circle class="pulse" cx="240" cy="160" r="34" fill="#FF2D9B"/>
  <circle class="led" cx="314" cy="112" r="6" fill="#00FFCC"/>

  <!-- Optional accent: pink EQ bars under the object -->
  <g class="eq" stroke="#FF2D9B" stroke-width="4" stroke-linecap="round">
    <path d="M222 266V290"/><path d="M240 258V298"/><path d="M258 268V288"/>
  </g>
</svg>
