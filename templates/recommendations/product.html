<article class="product-recommendation" aria-labelledby="product-$id">
  <div class="product-image"><img src="$image" alt="$image_alt" width="480" height="360" loading="lazy" decoding="async" data-product-image></div>
  <div class="product-copy">
    $badge
    <p class="product-merchant">$merchant</p>
    <h3 id="product-$id">$name</h3>
    <p>$description</p>
    $price
    $link
  </div>
</article>
