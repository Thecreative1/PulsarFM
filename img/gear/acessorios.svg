<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <title>Adaptador DAC com cabos, ficha jack e símbolo Bluetooth, nas cores néon da PulsarFM</title>
  <style>
    /* Transform/opacity only, so it stays on the compositor. Runs inside an img tag. */
    .cable { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .bt { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .led { animation: led 2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: .7; } }
    @keyframes ring { 0% { transform: scale(.7); opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }
    @keyframes led { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="480" height="360" rx="20" fill="#061D22"/>
