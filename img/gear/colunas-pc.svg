<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <title>Duas colunas de secretária ao lado de um ecrã, nas cores néon da PulsarFM</title>
  <style>
    /* Transform/opacity only, so it stays on the compositor. Runs inside an img tag. */
    .cone { transform-box: fill-box; transform-origin: center; animation: thump .6s ease-in-out infinite; }
    .cone.alt { animation-delay: -.3s; }
    .eq path { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
    .eq path:nth-child(2) { animation-delay: -.35s; animation-duration: .9s; }
    .eq path:nth-child(3) { animation-delay: -.7s; animation-duration: 1.3s; }
    .eq path:nth-child(4) { animation-delay: -.2s; animation-duration: 1s; }
    .eq path:nth-child(5) { animation-delay: -.55s; animation-duration: 1.2s; }
    .led { animation: led 2.4s ease-in-out infinite; }
    @keyframes thump { 50% { transform: scale(1.1); } }
    @keyframes eq { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    @keyframes led { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="480" height="360" rx="20" fill="#061D22"/>
  <path d="M0 300H480M44 0V360M436 0V360" stroke="#9AD9D3" stroke-opacity=".09"/>
  <!-- Monitor with a playing visualizer -->
  <rect x="160" y="70" width="160" height="110" rx="8" fill="#041015" stroke="#9AD9D3" stroke-opacity=".5" stroke-width="3"/>
  <g class="eq" stroke="#FF2D9B" stroke-width="6" stroke-linecap="round">
    <path d="M198 160V118"/><path d="M220 160V102"/><path d="M242 160V124"/><path d="M264 160V108"/><path d="M286 160V128"/>
  </g>
  <path d="M232 180V206M206 210H274" stroke="#9AD9D3" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  <!-- Desk line -->
  <path d="M64 270H416" stroke="#00FFCC" stroke-opacity=".35" stroke-width="2"/>
  <!-- Left speaker: tweeter on top, woofer below -->
  <rect x="78" y="120" width="68" height="148" rx="10" fill="#08292F" stroke="#00FFCC" stroke-width="2"/>
  <circle cx="112" cy="150" r="10" fill="#041015" stroke="#9AD9D3" stroke-opacity=".5"/>
  <circle cx="112" cy="212" r="26" fill="#041015" stroke="#9AD9D3" stroke-opacity=".4" stroke-width="2"/>
  <circle class="cone" cx="112" cy="212" r="13" fill="#C044FF"/>
  <circle class="led" cx="112" cy="252" r="3" fill="#00FFCC"/>
  <!-- Right speaker -->
  <rect x="334" y="120" width="68" height="148" rx="10" fill="#08292F" stroke="#00FFCC" stroke-width="2"/>
  <circle cx="368" cy="150" r="10" fill="#041015" stroke="#9AD9D3" stroke-opacity=".5"/>
  <circle cx="368" cy="212" r="26" fill="#041015" stroke="#9AD9D3" stroke-opacity=".4" stroke-width="2"/>
  <circle class="cone alt" cx="368" cy="212" r="13" fill="#C044FF"/>
</svg>
