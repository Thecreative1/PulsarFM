<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <title>Auscultadores com ondas de som, nas cores néon da PulsarFM</title>
  <style>
    /* Transform/opacity only, so it stays on the compositor. Runs inside an img tag. */
    .phones { animation: bob 5s ease-in-out infinite; }
    .wave { animation: wave 2.4s ease-in-out infinite; }
    .wave.far { animation-delay: -1.2s; }
    .eq path { transform-box: fill-box; transform-origin: center; animation: eq 1.1s ease-in-out infinite; }
    .eq path:nth-child(2) { animation-delay: -.35s; animation-duration: .9s; }
    .eq path:nth-child(3) { animation-delay: -.7s; animation-duration: 1.3s; }
    .eq path:nth-child(4) { animation-delay: -.2s; animation-duration: 1s; }
    .eq path:nth-child(5) { animation-delay: -.55s; animation-duration: 1.2s; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes wave { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes eq { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="480" height="360" rx="20" fill="#061D22"/>
  <path d="M0 300H480M44 0V360M436 0V360" stroke="#9AD9D3" stroke-opacity=".09"/>
  <g stroke-width="3" stroke-linecap="round">
    <path class="wave" d="M104 178C92 196 92 220 104 238" stroke="#00FFCC"/>
    <path class="wave far" d="M82 162C62 192 62 224 82 254" stroke="#C044FF"/>
    <path class="wave" d="M376 178C388 196 388 220 376 238" stroke="#00FFCC"/>
    <path class="wave far" d="M398 162C418 192 418 224 398 254" stroke="#C044FF"/>
  </g>
  <g class="phones">
    <path d="M150 176C150 62 330 62 330 176" stroke="#00CCFF" stroke-width="14" stroke-linecap="round"/>
    <path d="M165 172C165 84 315 84 315 172" stroke="#9AD9D3" stroke-opacity=".5" stroke-width="7"/>
    <rect x="124" y="160" width="52" height="96" rx="24" fill="#0C3C43" stroke="#00CCFF" stroke-width="3"/>
    <rect x="304" y="160" width="52" height="96" rx="24" fill="#0C3C43" stroke="#00CCFF" stroke-width="3"/>
    <circle cx="150" cy="208" r="11" fill="#FF2D9B"/>
    <circle cx="330" cy="208" r="11" fill="#FF2D9B"/>
    <circle cx="146" cy="203" r="3" fill="#FFFFFF" fill-opacity=".35"/>
    <circle cx="326" cy="203" r="3" fill="#FFFFFF" fill-opacity=".35"/>
  </g>
  <g class="eq" stroke="#FF2D9B" stroke-width="4" stroke-linecap="round">
    <path d="M204 290V318"/><path d="M222 280V328"/><path d="M240 294V314"/><path d="M258 284V324"/><path d="M276 296V312"/>
  </g>
</svg>
