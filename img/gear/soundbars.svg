<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <title>Televisor com sol synthwave e uma soundbar a emitir som, nas cores néon da PulsarFM</title>
  <style>
    /* Transform/opacity only, so it stays on the compositor. Runs inside an img tag. */
    .sun { animation: glow 4s ease-in-out infinite; }
    .grid { animation: scroll 2s linear infinite; }
    .wave { animation: wave 2.2s ease-in-out infinite; }
    .wave.far { animation-delay: -1.1s; }
    .led { animation: led 2.4s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .65; } }
    @keyframes scroll { to { transform: translateY(12px); } }
    @keyframes wave { 0%, 100% { opacity: .15; transform: translateY(4px); } 50% { opacity: .9; transform: translateY(0); } }
    @keyframes led { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><clipPath id="screen"><rect x="104" y="44" width="272" height="148" rx="6"/></clipPath></defs>
  <rect width="480" height="360" rx="20" fill="#061D22"/>
  <path d="M0 300H480M44 0V360M436 0V360" stroke="#9AD9D3" stroke-opacity=".09"/>
  <rect x="92" y="32" width="296" height="172" rx="10" fill="#041015" stroke="#9AD9D3" stroke-opacity=".5" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="104" y="44" width="272" height="148" fill="#14282F"/>
    <circle class="sun" cx="240" cy="132" r="46" fill="#FF2D9B" fill-opacity=".85"/>
    <path d="M190 116H290M186 128H294M188 140H292" stroke="#14282F" stroke-width="4"/>
    <rect x="104" y="140" width="272" height="52" fill="#0C2A30"/>
    <path d="M104 140H376" stroke="#C044FF" stroke-width="2"/>
    <g class="grid" stroke="#C044FF" stroke-opacity=".45">
      <path d="M104 140H376M104 152H376M104 164H376M104 176H376M104 188H376"/>
    </g>
    <path d="M240 140L180 192M240 140L300 192M240 140L130 192M240 140L350 192M240 140V192" stroke="#C044FF" stroke-opacity=".45"/>
  </g>
  <path d="M226 204L218 220H262L254 204" stroke="#9AD9D3" stroke-opacity=".4" stroke-width="3"/>
  <g stroke-width="3" stroke-linecap="round">
    <path class="wave far" d="M128 222C170 204 310 204 352 222" stroke="#C044FF"/>
    <path class="wave" d="M152 232C190 220 290 220 328 232" stroke="#00FFCC"/>
  </g>
  <rect x="96" y="240" width="288" height="36" rx="18" fill="#08292F" stroke="#00FFCC" stroke-width="2"/>
  <g fill="#9AD9D3" fill-opacity=".4">
    <circle cx="128" cy="258" r="2.5"/><circle cx="142" cy="258" r="2.5"/><circle cx="156" cy="258" r="2.5"/><circle cx="170" cy="258" r="2.5"/><circle cx="184" cy="258" r="2.5"/><circle cx="198" cy="258" r="2.5"/><circle cx="212" cy="258" r="2.5"/>
    <circle cx="268" cy="258" r="2.5"/><circle cx="282" cy="258" r="2.5"/><circle cx="296" cy="258" r="2.5"/><circle cx="310" cy="258" r="2.5"/><circle cx="324" cy="258" r="2.5"/><circle cx="338" cy="258" r="2.5"/><circle cx="352" cy="258" r="2.5"/>
  </g>
  <circle class="led" cx="240" cy="258" r="5" fill="#00FFCC"/>
</svg>
