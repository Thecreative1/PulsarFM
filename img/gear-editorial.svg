<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" fill="none">
  <title>Uma sessão de escuta: gira-discos, auscultadores e discos</title>
  <style>
    /* Transform/opacity only, so it stays on the compositor. Runs inside an img tag. */
    .spin { transform-origin: 273px 320px; animation: spin 6s linear infinite; }
    .phones { animation: bob 5s ease-in-out infinite; }
    .arm { transform-origin: 464px 251px; animation: arm 4s ease-in-out infinite; }
    .led { animation: led 2.4s ease-in-out infinite; }
    .cable { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .eq path { transform-box: fill-box; transform-origin: center; animation: eq 1.1s ease-in-out infinite; }
    .eq path:nth-child(2) { animation-delay: -.35s; animation-duration: .9s; }
    .eq path:nth-child(3) { animation-delay: -.7s; animation-duration: 1.3s; }
    .eq path:nth-child(4) { animation-delay: -.2s; animation-duration: 1s; }
    .eq path:nth-child(5) { animation-delay: -.55s; animation-duration: 1.2s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes arm { 50% { transform: rotate(-1.2deg); } }
    @keyframes led { 50% { opacity: .35; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes eq { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="720" height="520" rx="24" fill="#061D22"/>
  <path d="M0 421H720M64 0V520M656 0V520" stroke="#9AD9D3" stroke-opacity=".09"/>
  <rect x="394" y="57" width="212" height="230" rx="8" transform="rotate(9 394 57)" fill="#14282F" stroke="#C044FF" stroke-opacity=".55"/>
  <circle cx="483" cy="172" r="70" stroke="#C044FF" stroke-width="2"/>
  <circle cx="483" cy="172" r="24" fill="#C044FF" fill-opacity=".25"/>
  <path d="M409 240L544 261" stroke="#9AD9D3" stroke-opacity=".5" stroke-width="5"/>
  <rect x="92" y="202" width="451" height="238" rx="16" fill="#08292F" stroke="#00FFCC" stroke-width="2"/>
  <rect x="105" y="215" width="425" height="212" rx="10" stroke="#9AD9D3" stroke-opacity=".15"/>
  <circle cx="273" cy="320" r="94" fill="#041015" stroke="#9AD9D3" stroke-opacity=".4" stroke-width="3"/>
  <g class="spin">
    <g stroke="#9AD9D3" stroke-opacity=".16"><circle cx="273" cy="320" r="83"/><circle cx="273" cy="320" r="74"/><circle cx="273" cy="320" r="65"/><circle cx="273" cy="320" r="56"/></g>
    <path d="M214 262A83 83 0 0 1 273 237M332 378A83 83 0 0 1 273 403" stroke="#ECFFFB" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    <circle cx="273" cy="320" r="31" fill="#FF2D9B"/>
    <circle cx="273" cy="300" r="4" fill="#FFFFFF" fill-opacity=".35"/>
    <circle cx="273" cy="320" r="5" fill="#ECFFFB"/>
  </g>
  <circle cx="464" cy="251" r="15" fill="#0C3C43" stroke="#9AD9D3"/>
  <g class="arm">
    <path d="M464 251V327L399 372" stroke="#ECFFFB" stroke-width="7" stroke-linecap="round"/>
    <path d="M399 372L384 383" stroke="#00FFCC" stroke-width="14" stroke-linecap="round"/>
  </g>
  <circle class="led" cx="488" cy="396" r="8" fill="#00FFCC"/>
  <g class="phones">
    <path class="cable" d="M264 178C318 183 328 152 359 158" stroke="#00CCFF" stroke-opacity=".6" stroke-width="2"/>
    <path d="M137 102C137 26 259 26 259 102V161M137 102V161" stroke="#00CCFF" stroke-width="13" stroke-linecap="round"/>
    <path d="M150 103C150 45 246 45 246 103" stroke="#9AD9D3" stroke-opacity=".5" stroke-width="7"/>
    <rect x="124" y="113" width="34" height="67" rx="15" fill="#0C3C43" stroke="#00CCFF" stroke-width="3"/>
    <rect x="239" y="113" width="34" height="67" rx="15" fill="#0C3C43" stroke="#00CCFF" stroke-width="3"/>
  </g>
  <g class="eq" stroke="#FF2D9B" stroke-width="4" stroke-linecap="round">
    <path d="M568 349V393"/><path d="M582 335V407"/><path d="M596 354V388"/><path d="M610 341V401"/><path d="M624 360V382"/>
  </g>
</svg>
